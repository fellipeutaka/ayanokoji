#   https://lefthook.dev/configuration/
#
pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files} && pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    type-check:
      glob: "*.{ts,d.cts,d.mts,tsx}"
      run: pnpm run type-check
